<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Future Letter</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="background-hearts" id="backgroundHearts"></div>

  <main class="page">

    <section class="hero">

      <p class="eyebrow">
        A MESSAGE FROM THE PAST
      </p>

      <h1>
        A Letter to My Future Self
      </h1>

      <p class="subtitle">
        Some words are worth keeping.
      </p>

    </section>


    <section class="letter-section">

      <p class="hint" id="hint">
        💌 You received a letter. Click the envelope to open it.
      </p>


      <div
        class="envelope"
        id="envelope"
        onclick="openLetter()"
      >

        <div class="flap"></div>


        <div class="letter">

          <div class="letter-content">

            <p class="date">
              To my future self,
            </p>

            <h2>
              Dear Future Me,
            </h2>

            <div
              class="message"
              id="message"
            ></div>


            <button
              class="continue-button"
              id="continueButton"
              onclick="finishLetter(event)"
            >
              ✨ I'll keep going
            </button>

          </div>

        </div>

      </div>

    </section>

  </main>


  <script src="script.js"></script>

</body>
</html>
