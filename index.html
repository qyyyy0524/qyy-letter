<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Future Letter</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <div
    class="background-hearts"
    id="backgroundHearts"
  ></div>


  <main
    class="page"
    id="landingPage"
  >

    <section
      class="hero"
      id="hero"
    >

      <p class="eyebrow">
        A MESSAGE FROM THE PAST
      </p>

      <h1>
        A Letter to My Future Self
      </h1>

      <p class="subtitle">
        Some words are worth keeping.
      </p>

    </section>


    <section
      class="letter-section"
      id="letterSection"
    >

      <p
        class="hint"
        id="hint"
      >
        💌 A letter from your past is waiting.
      </p>


      <div
        class="envelope"
        id="envelope"
        onclick="openLetter()"
      >

        <div class="flap"></div>

        <div class="envelope-pocket"></div>


        <article
          class="letter"
          id="letter"
        >

          <div class="letter-content">

            <p class="date">
              To my future self,
            </p>

            <h2>
              Dear Future Me,
            </h2>

            <div
              class="message"
              id="message"
            ></div>


            <button
              class="continue-button"
              id="continueButton"
              onclick="finishLetter(event)"
            >
              ✨ I'll keep going
            </button>

          </div>

        </article>

      </div>

    </section>

  </main>


  <section
    class="writer-page hidden-page"
    id="writerPage"
  >

    <div class="writer-container">

      <p class="eyebrow">
        YOUR TURN
      </p>

      <h1>
        Write to Your Future Self
      </h1>

      <p class="writer-subtitle">
        Write something you want your future self to remember.
      </p>


      <div class="writer-card">

        <label for="futureDate">
          Open this letter on
        </label>

        <input
          type="date"
          id="futureDate"
        >


        <label for="letterInput">
          Your letter
        </label>

        <textarea
          id="letterInput"
          placeholder="Dear Future Me,

There is something I want you to remember..."
        ></textarea>


        <div class="writer-actions">

          <button
            class="secondary-button"
            onclick="goBack()"
          >
            ← Back
          </button>


          <button
            class="save-button"
            onclick="saveLetter()"
          >
            Save My Letter ✨
          </button>

        </div>


        <p
          class="save-message"
          id="saveMessage"
        ></p>

      </div>


      <div
        class="saved-letter"
        id="savedLetter"
      >

        <p class="saved-label">
          SAVED LETTER
        </p>

        <h2>
          Your letter is waiting.
        </h2>

        <p
          class="saved-date"
          id="savedDate"
        ></p>

        <p
          class="saved-preview"
          id="savedPreview"
        ></p>

        <button
          class="delete-button"
          onclick="deleteLetter()"
        >
          Delete saved letter
        </button>

      </div>

    </div>

  </section>


  <script src="script.js"></script>

</body>
</html>
